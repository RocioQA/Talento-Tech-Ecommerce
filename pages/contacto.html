<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulario de contacto de Talento Tech Ecommerce.">
    <title>Contacto | Talento Tech Ecommerce</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <!-- ============ HEADER ============ -->
    <header class="header">
        <a href="../index.html" class="logo-link">
            <img src="../img/logo.svg" alt="Logo de Talento Tech Ecommerce" class="logo">
        </a>
        <nav aria-label="Navegación principal">
            <ul class="navbar">
                <li><a href="../index.html#inicio">Inicio</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- ============ CONTACTO ============ -->
        <section class="contacto section-p1">
            <h1 class="section-title">Contacto</h1>
            <p class="section-sub">Completá el formulario y te respondemos por correo en menos de 24 horas.</p>

            <form class="form" action="https://formspree.io/f/xnpjdggl" method="POST">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>

                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="tuemail@ejemplo.com" required>

                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje" rows="5" placeholder="¿En qué podemos ayudarte?" required></textarea>

                <input type="hidden" name="_subject" value="Nuevo mensaje desde la tienda">
                <button type="submit" class="btn">Enviar mensaje</button>
            </form>
        </section>
    </main>

    <!-- ============ FOOTER ============ -->
    <footer class="footer">
        <p>&copy; 2026 Talento Tech Ecommerce. Todos los derechos reservados.</p>
        <nav aria-label="Enlaces del pie de página">
            <ul class="footer-links">
                <li><a href="../index.html">Volver al inicio</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </footer>

</body>

</html>
